[project]
name = "antiphon"
version = "0.1.0"
description = "Make Claude Code sessions and Codex CLI sessions peers of each other on one machine"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
antiphon = "antiphon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antiphon"]
# The forward hook travels with the code: `start --claude` points a session's --settings at
# it, so it has to exist wherever antiphon is installed, not only in a checkout.
force-include = { "hooks/claude-permission-forward.sh" = "antiphon/claude/claude-permission-forward.sh" }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

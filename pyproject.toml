[project]
name = "antiphon"
version = "0.1.0"
description = "Make Claude Code sessions and Codex CLI sessions peers of each other on one machine"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
antiphon = "antiphon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antiphon"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
